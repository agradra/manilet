[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "manilet"
dynamic = ["version"]
description = "nexus_app: 넥서스 에이전트 관리 앱\nnexuspy: 에이전트 설계용 SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "agradra" }
]

[tool.uv]
package = false
required-version = ">=0.6.0"

[tool.uv.workspace]
members = ["nexuspy", "nexus_app"]

[dependency-groups]
dev = [
    "ruff",
    "deptry",
    "pytest",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F403", "F405", "E701", "W291", "W293", "F841"]

[tool.ruff.format]
quote-style = "double"
