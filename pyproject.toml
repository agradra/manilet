[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "manilet"
dynamic = ["version"]
description = "nexus_app: 넥서스 에이전트 관리 앱\nnexuspy: 에이전트 설계용 SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.44.2",
    "typer>=0.27.2",
]
authors = [
    { name = "agradra" }
]

[tool.uv]
package = false
required-version = ">=0.6.0"

[tool.uv.workspace]
members = ["nexuspy", "nexus_app","praeforum"]

[dependency-groups]
dev = [
    "deptry",
    "pytest",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
