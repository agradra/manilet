name: manilet-CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build nexuspy
        run: uv build --package manilet-nexuspy

      - name: Build nexus_app
        run: uv build --package manilet-nexus-app

  build-aetaforum:
    name: Build Aetaforum (Tauri)
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm dependencies
        working-directory: ./aetaforum/gui
        run: npm install

      - name: Install Python build tools
        working-directory: ./aetaforum
        run: pip install build

      - name: Build Python Wheel (aetaforum)
        working-directory: ./aetaforum
        run: python -m build --wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetaforum-wheel-${{ matrix.os }}
          path: ./aetaforum/dist/*.whl
