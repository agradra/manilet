[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "manilet-aetaforum"
dynamic = ["version"]
description = "백테스팅 프로그램"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "agradra" }
]

dependencies = [
    "polars>=1.44.2",
    "hatchling>=1.32.3",
    "typer>=0.27.2",
    "packaging>=26.3",
]

[tool.hatch.build.targets.wheel]
packages = [
    "aetaforum",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.version.raw-options]
root = ".."

[project.scripts]
aetaforum = "aetaforum.cli:main"

[tool.hatch.build]
artifacts = [
    "aetaforum/bin/**/*"
]
